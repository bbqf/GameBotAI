name: release-installer

# Installers are release artifacts, so they are built from master: every push to
# master - in practice, every PR merge - produces one installer for that merged
# state. Open PRs deliberately do NOT build an installer; they are gated by
# .NET CI and CodeQL instead. Use workflow_dispatch to build an installer from
# any branch on demand.
#
# There is deliberately no `paths` filter: the installer payload is the full
# publish closure of src/GameBot.Service (which transitively pulls in every
# referenced project under src/**), the built src/web-ui/dist bundle, the root
# LICENSE, and the repo-wide MSBuild/NuGet settings - see
# scripts/package-installer-payload.ps1. Practically any source change alters
# what the installer contains, so a path filter could never be complete, and an
# incomplete one silently skips runs and leaves the latest master commit with no
# installer of its own. The job takes ~3.5 minutes on windows-latest.
#
# A GitHub Release is published only on request (feature 131). Start this workflow by hand
# on master with publish_release set to true. A plain push to master never creates a release.
# The installed bots read the latest release to offer an update.
on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release with the MSI, the installer EXE, and the update manifest (master only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Master pushes must never cancel each other: each one is the release build for
  # a distinct merged commit, and a cancelled run leaves that commit with no
  # installer (and burns the github.run_number that would have versioned it).
  # Back-to-back merges queue instead. On-demand workflow_dispatch runs are just
  # rebuilds of a branch tip, so a newer one may still supersede an older one.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build-release-installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: 'src/web-ui/package-lock.json'
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Install web-ui dependencies
        shell: pwsh
        working-directory: src/web-ui
        run: npm ci
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Configuration Release
      - name: Verify signature policy marker
        shell: pwsh
        run: |
          Write-Host "Release signing verification must run in release pipeline with org certificates."
      - name: Compute artifact name
        id: version
        shell: pwsh
        run: |
          $overridePath = "installer/versioning/version.override.json"

          $override = Get-Content -Path $overridePath -Raw | ConvertFrom-Json

          $major = if ($null -ne $override.major) { [int]$override.major } else { 1 }
          $minor = if ($null -ne $override.minor) { [int]$override.minor } else { 0 }
          $patch = if ($null -ne $override.patch) { [int]$override.patch } else { 0 }
          $build = [int]$env:GITHUB_RUN_NUMBER

          $version = "$major.$minor.$patch.$build"
          $branchName = if ([string]::IsNullOrWhiteSpace($env:GITHUB_HEAD_REF)) { $env:GITHUB_REF_NAME } else { $env:GITHUB_HEAD_REF }
          $safeBranch = ($branchName -replace '[^A-Za-z0-9._-]', '-').ToLowerInvariant()

          if ($safeBranch -eq "main" -or $safeBranch -eq "master") {
            $artifactName = "gamebot-installer-v$version-win-x64"
          }
          else {
            $artifactName = "gamebot-installer-v$version-$safeBranch-win-x64"
          }

          "INSTALLER_ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Artifact name: $artifactName"
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.INSTALLER_ARTIFACT_NAME }}
          if-no-files-found: error
          path: |
            installer/wix/bin/x64/Release/GameBotInstaller.exe
      # The release files are the files of this build. The publish job downloads them and does
      # not build again. The steps run only when the owner asks for a release.
      - name: Write update manifest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item installer/wix/payload/GameBot.msi release-assets/GameBot.msi
          Copy-Item installer/wix/bin/x64/Release/GameBotInstaller.exe release-assets/GameBotInstaller.exe
          ./scripts/new-update-manifest.ps1 `
            -MsiPath release-assets/GameBot.msi `
            -OutputPath release-assets/update-manifest.json `
            -Version "${{ steps.version.outputs.version }}"
      - name: Upload release assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: actions/upload-artifact@v6
        with:
          name: release-assets
          if-no-files-found: error
          path: release-assets/*

  publish-release:
    # Runs only on master and only when the owner asks for it. A push to master never runs it.
    needs: build-release-installer
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v6
        with:
          name: release-assets
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-release-installer.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            release-assets/GameBot.msi \
            release-assets/GameBotInstaller.exe \
            release-assets/update-manifest.json \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes
